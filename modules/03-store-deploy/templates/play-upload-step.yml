# Release Conveyor Kit - module 03-store-deploy (optional)
# Append this job to .github/workflows/android-build.yml (module 02) to upload
# the AAB to a Google Play testing track automatically.
#
# ADDED BY THE KIT - NOT used in the donor project (the donor uploaded manually
# and used Firebase App Distribution for QA). Verify on a non-production track.
#
# Prerequisites (see google-play.md, "Опция: автозагрузка"):
#   - service account JSON in secret PLAY_SERVICE_ACCOUNT_JSON
#   - service account invited in Play Console with release permission
#   - at least one release uploaded manually before the API works
#
# conveyor: mobile.android.appId, mobile.android.playUpload.track

  upload-to-play:
    needs: [build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download signed AAB
        uses: actions/download-artifact@v4
        with:
          name: android-${{ github.sha }}

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.example.yourapp # conveyor: mobile.android.appId
          releaseFiles: app-release-signed.aab
          track: internal # conveyor: mobile.android.playUpload.track
          status: completed
