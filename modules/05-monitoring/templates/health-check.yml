# Release Conveyor Kit - module 05-monitoring
# Scheduled production health check. KIT ADDITION - not present in the donor.
# Pings the web app and the Supabase REST endpoint; a red run = GitHub
# notification (add the alert step below for instant alerts in the team chat).
#
# conveyor: web.productionUrl

name: Health Check

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours; GitHub may delay scheduled runs
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check web app
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            "https://your-app.vercel.app/") # conveyor: web.productionUrl
          echo "web: HTTP $code"
          [ "$code" = "200" ] || exit 1

      - name: Check Supabase (auth health endpoint)
        # /auth/v1/health returns 200 with just the anon key; /rest/v1/ may
        # answer 401 on newer projects (found during kit self-test).
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            "$VITE_SUPABASE_URL/auth/v1/health")
          echo "supabase auth health: HTTP $code"
          [ "$code" = "200" ] || exit 1

      # Optional instant alert to the team chat. One backend is enough:
      # TELEGRAM_BOT_TOKEN_REPORTS + TELEGRAM_CHAT_ID_REPORTS (Telegram Bot API,
      # pattern proven in the donor's e2e workflow) or NOTIFY_WEBHOOK_URL_REPORTS
      # (an incoming webhook that accepts {"text": ...}, Slack-style; added by
      # the kit, not verified). Without secrets the step exits quietly.
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_REPORTS }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_REPORTS }}
          WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL_REPORTS }}
        run: |
          TEXT="🔴 Health check FAILED: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" -F "text=${TEXT}" > /dev/null
          elif [ -n "$WEBHOOK_URL" ]; then
            curl -s -H 'Content-Type: application/json' \
              -d "{\"text\":\"${TEXT}\"}" "$WEBHOOK_URL" > /dev/null
          fi
