# Release Conveyor Kit - module 02-mobile-build (Android)
# Signed AAB + APK on a version tag (v*) or manual dispatch.
# Origin: extracted from a proven the donor project workflow (android-build.yml).
# The Firebase App Distribution step is optional - delete it if unused.
#
# Prerequisites in the target project:
#   - capacitor android platform committed (npx cap add android)
#   - android/app/build.gradle reads VERSION_CODE property (see build.gradle.snippet)
#   - upload keystore generated and stored as base64 secret (see module README)
#
# Parameterization:
#   conveyor: project.nodeVersion, mobile.android.keystoreFileName,
#             mobile.android.firebaseDistribution.*

name: Android Build & Distribute

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  SIGNED_OUTPUT_DIR: build/android-signed
  KEYSTORE_FILE: release.jks # conveyor: mobile.android.keystoreFileName

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # conveyor: project.nodeVersion
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Create .env.production
        # Add every VITE_* variable your app needs at build time.
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env.production
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.production

      - name: Build web
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x android/gradlew

      - name: Decode keystore
        run: |
          mkdir -p $HOME/.android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $HOME/.android/${{ env.KEYSTORE_FILE }}

      # Only needed when the app uses Firebase (push notifications, analytics).
      # Delete this step otherwise.
      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Build Android App (AAB + APK)
        working-directory: android
        run: |
          ./gradlew bundleRelease assembleRelease \
            -PVERSION_CODE=${{ github.run_number }} \
            -Pandroid.injected.signing.store.file="$HOME/.android/${{ env.KEYSTORE_FILE }}" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Collect signed artifacts
        working-directory: android
        run: |
          mkdir -p ${{ env.SIGNED_OUTPUT_DIR }}
          cp app/build/outputs/bundle/release/app-release.aab \
             ${{ env.SIGNED_OUTPUT_DIR }}/app-release-signed.aab
          cp app/build/outputs/apk/release/app-release.apk \
             ${{ env.SIGNED_OUTPUT_DIR }}/app-release-signed.apk

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.sha }}
          path: |
            android/${{ env.SIGNED_OUTPUT_DIR }}/app-release-signed.aab
            android/${{ env.SIGNED_OUTPUT_DIR }}/app-release-signed.apk

      # Optional QA distribution. Requires a Firebase project.
      # Delete if conveyor: mobile.android.firebaseDistribution.enabled = false.
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: qa-internal # conveyor: mobile.android.firebaseDistribution.testerGroup
          file: android/${{ env.SIGNED_OUTPUT_DIR }}/app-release-signed.apk
          releaseNotes: "Build ${{ github.ref_name }} - ${{ github.sha }}"
