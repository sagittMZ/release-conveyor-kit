# arch-viz: deterministic rebuild of the architecture visualization plus a
# staleness check with a HARD guarantee - a notification to the project's
# chat (a messenger topic or channel) when the data goes stale (sources newer than arch-data.json).
# Anti-spam: one ping per staleness episode (when it STARTED in this push); the
# summary is always written.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   one backend is enough; Telegram is the proven one, the webhook is added by
#   the kit and not verified:
#   TELEGRAM_BOT_TOKEN   the bot token                       (Telegram backend)
#   TELEGRAM_CHAT_ID     the group or chat id                (Telegram backend)
#   TELEGRAM_THREAD_ID   the topic id in a forum group, empty = no topic
#   NOTIFY_WEBHOOK_URL   an incoming webhook that accepts {"text": ...}
#                        (Slack-style; webhook backend)
# Without the secrets the workflow still runs; the notification is skipped
# quietly (the summary says so).
#
# Where it goes: the target project's .github/workflows/arch-viz.yml.
# Projects with a develop branch: keep the automatic trigger on main only and
# use workflow_dispatch for develop (it also carries test_notify to check the
# wiring).
name: arch-viz

on:
  push:
    branches: [main]   # conveyor: ci.mainBranch
  workflow_dispatch:
    inputs:
      test_notify:
        description: 'Send a test notification'
        required: false
        default: 'false'

permissions:
  contents: write   # only for auto-committing the rebuilt HTML; usually a no-op

concurrency:
  group: arch-viz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch-viz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, SHA-pinned
        with:
          fetch-depth: 0

      - name: Rebuild HTML from committed data
        run: |
          set -euo pipefail
          if [ ! -f docs/arch/arch-data.json ]; then
            echo "no docs/arch/arch-data.json - the visualization has never been generated (/arch-viz)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bash tools/prompt-kit/arch-viz/build-arch-viz.sh   # conveyor: path to the builder
          if git diff --quiet -- docs/arch/index.html; then
            echo "HTML is current (no-op)" >> "$GITHUB_STEP_SUMMARY"
          else
            git config user.name "arch-viz-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/arch/index.html
            git commit -m "chore(arch-viz): rebuild HTML from committed data [skip ci]"
            git push
            echo "HTML lagged behind the data - rebuilt and committed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Staleness check + notification guarantee
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_THREAD: ${{ secrets.TELEGRAM_THREAD_ID }}
          WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          BEFORE_SHA: ${{ github.event.before }}
          TEST_NOTIFY: ${{ inputs.test_notify }}
        run: |
          set -euo pipefail
          notify() { # notify <text>; returns 0 only on confirmed delivery
            local resp code payload
            if [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ]; then
              # backend: Telegram Bot API (proven)
              resp="$(curl -s --max-time 20 \
                --data-urlencode "chat_id=${TG_CHAT}" \
                ${TG_THREAD:+--data-urlencode "message_thread_id=${TG_THREAD}"} \
                --data-urlencode "text=$1" \
                "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" 2>&1)" || resp="curl failed: $resp"
              if printf '%s' "$resp" | grep -q '"ok":true'; then
                echo "(notification delivered)" >> "$GITHUB_STEP_SUMMARY"
                return 0
              fi
            elif [ -n "${WEBHOOK_URL:-}" ]; then
              # backend: a generic incoming webhook that accepts {"text": ...}
              # (Slack-style; added by the kit, not verified)
              payload="$(printf '{"text":"%s"}' "$(printf '%s' "$1" | sed 's/["\\]/\\&/g')")"
              code="$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' \
                -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK_URL" 2>&1)" || code="curl failed: $code"
              case "$code" in
                2*) echo "(notification delivered)" >> "$GITHUB_STEP_SUMMARY"; return 0 ;;
              esac
              resp="HTTP $code"
            else
              echo "(notification skipped: no TELEGRAM_* or NOTIFY_WEBHOOK_URL secret is configured)" >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi
            echo "(notification NOT delivered, response: ${resp})" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::arch-viz: notification not delivered: ${resp}"
            return 1
          }
          if [ "${TEST_NOTIFY:-false}" = "true" ]; then
            # test mode is strict: no delivery means a red run
            notify "arch-viz: test notification from ${GITHUB_REPOSITORY} - the CI -> chat wiring works."
            exit $?
          fi
          [ -f docs/arch/arch-data.json ] || exit 0
          # conveyor: the source paths the visualization watches
          SRC_PATHS="src/"
          stale_at() { # stale_at <rev> -> 0 if the data is stale at that revision
            local d s
            d="$(git log -1 --format=%ct "$1" -- docs/arch/arch-data.json 2>/dev/null || echo 0)"
            s="$(git log -1 --format=%ct "$1" -- $SRC_PATHS 2>/dev/null || echo 0)"
            [ "${s:-0}" -gt "${d:-0}" ]
          }
          if stale_at HEAD; then
            {
              echo "### The architecture visualization is stale"
              echo "Sources changed later than arch-data.json. Run \`/arch-viz\` in the project session."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::arch-viz: the data is older than the sources - run /arch-viz"
            # ping only at the start of an episode: before this push it was not stale
            if [ -n "${BEFORE_SHA:-}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE_SHA}" 2>/dev/null && stale_at "${BEFORE_SHA}"; then
              echo "(the staleness episode was already running - not duplicating the ping)" >> "$GITHUB_STEP_SUMMARY"
            else
              notify "arch-viz: the architecture visualization in ${GITHUB_REPOSITORY} is stale - the sources are newer than arch-data.json. Run /arch-viz in the project session." || true
            fi
          else
            echo "The visualization data is not older than the sources" >> "$GITHUB_STEP_SUMMARY"
          fi
