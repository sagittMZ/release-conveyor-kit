# arch-viz: детерминированная пересборка визуализации архитектуры + staleness.
# Семантика гибрида (модуль 13): данные обновляет /arch-viz в сессии; CI лишь
# (1) пересобирает HTML, если он отстал от закоммиченных данных/шаблона,
# (2) сообщает в summary, когда исходники проекта моложе arch-data.json.
#
# Куда кладётся: .github/workflows/arch-viz.yml целевого проекта.
# Проекты с develop: авто-триггер оставить только на main (ниже), для develop
# пользоваться ручным запуском (workflow_dispatch уже включён).
name: arch-viz

on:
  push:
    branches: [main]   # conveyor: ci.mainBranch
  workflow_dispatch:

permissions:
  contents: write   # только ради автокоммита пересобранного HTML; обычно no-op

concurrency:
  group: arch-viz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch-viz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, SHA-pinned
        with:
          fetch-depth: 0

      - name: Rebuild HTML from committed data
        run: |
          set -euo pipefail
          if [ ! -f docs/arch/arch-data.json ]; then
            echo "нет docs/arch/arch-data.json - визуализация ещё не генерировалась (/arch-viz)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bash tools/prompt-kit/arch-viz/build-arch-viz.sh   # conveyor: путь к builder
          if git diff --quiet -- docs/arch/index.html; then
            echo "HTML актуален (no-op)" >> "$GITHUB_STEP_SUMMARY"
          else
            git config user.name "arch-viz-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/arch/index.html
            git commit -m "chore(arch-viz): rebuild HTML from committed data [skip ci]"
            git push
            echo "HTML отставал от данных - пересобран и закоммичен" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Staleness report (data vs sources)
        run: |
          set -euo pipefail
          [ -f docs/arch/arch-data.json ] || exit 0
          data_t="$(git log -1 --format=%ct -- docs/arch/arch-data.json)"
          # conveyor: пути исходников, за которыми следит визуализация
          src_t="$(git log -1 --format=%ct -- src/ 2>/dev/null || echo 0)"
          if [ "${src_t:-0}" -gt "${data_t:-0}" ]; then
            {
              echo "### Визуализация архитектуры устарела"
              echo "Исходники менялись позже arch-data.json."
              echo "В сессии проекта прогони \`/arch-viz\` и закоммить данные + HTML."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::arch-viz: данные старее исходников - прогони /arch-viz в сессии"
          else
            echo "Данные визуализации не старее исходников" >> "$GITHUB_STEP_SUMMARY"
          fi
