# arch-viz: детерминированная пересборка визуализации архитектуры + staleness
# с ЖЁСТКОЙ гарантией: уведомление в Telegram-топик проекта, когда данные
# устарели (исходники моложе arch-data.json). Анти-спам: пинг один раз на
# эпизод устаревания (когда оно ПОЯВИЛОСЬ в этом пуше), summary - всегда.
#
# Секреты (Settings -> Secrets and variables -> Actions):
#   TELEGRAM_BOT_TOKEN   токен бота
#   TELEGRAM_CHAT_ID     id группы/чата
#   TELEGRAM_THREAD_ID   id топика проекта в форум-группе (пусто = без топика)
# Без секретов workflow работает, уведомление тихо пропускается (см. summary).
#
# Догфуд кита. Источник шаблона: modules/13-arch-viz/templates/arch-viz.yml.
name: arch-viz

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_notify:
        description: 'Send a test Telegram notification'
        required: false
        default: 'false'

permissions:
  contents: write   # только ради автокоммита пересобранного HTML; обычно no-op

concurrency:
  group: arch-viz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch-viz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, SHA-pinned
        with:
          fetch-depth: 0

      - name: Rebuild HTML from committed data
        run: |
          set -euo pipefail
          if [ ! -f docs/arch/arch-data.json ]; then
            echo "нет docs/arch/arch-data.json - визуализация ещё не генерировалась (/arch-viz)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bash modules/13-arch-viz/build-arch-viz.sh
          if git diff --quiet -- docs/arch/index.html; then
            echo "HTML актуален (no-op)" >> "$GITHUB_STEP_SUMMARY"
          else
            git config user.name "arch-viz-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/arch/index.html
            git commit -m "chore(arch-viz): rebuild HTML from committed data [skip ci]"
            git push
            echo "HTML отставал от данных - пересобран и закоммичен" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Staleness check + Telegram guarantee
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_THREAD: ${{ secrets.TELEGRAM_THREAD_ID }}
          BEFORE_SHA: ${{ github.event.before }}
          TEST_NOTIFY: ${{ inputs.test_notify }}
        run: |
          set -euo pipefail
          notify() { # notify <текст>
            if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
              echo "(TG-уведомление пропущено: секреты TELEGRAM_* не настроены)" >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            curl -s -o /dev/null --max-time 20 \
              --data-urlencode "chat_id=${TG_CHAT}" \
              ${TG_THREAD:+--data-urlencode "message_thread_id=${TG_THREAD}"} \
              --data-urlencode "text=$1" \
              "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" || true
            echo "(TG-уведомление отправлено)" >> "$GITHUB_STEP_SUMMARY"
          }
          if [ "${TEST_NOTIFY:-false}" = "true" ]; then
            notify "arch-viz: тестовое уведомление из ${GITHUB_REPOSITORY} - связка CI -> Telegram работает."
            exit 0
          fi
          [ -f docs/arch/arch-data.json ] || exit 0
          # кит: следим за modules/
          SRC_PATHS="modules/"
          stale_at() { # stale_at <rev> -> 0 если данные устарели на этой ревизии
            local d s
            d="$(git log -1 --format=%ct "$1" -- docs/arch/arch-data.json 2>/dev/null || echo 0)"
            s="$(git log -1 --format=%ct "$1" -- $SRC_PATHS 2>/dev/null || echo 0)"
            [ "${s:-0}" -gt "${d:-0}" ]
          }
          if stale_at HEAD; then
            {
              echo "### Визуализация архитектуры устарела"
              echo "Исходники менялись позже arch-data.json. Прогони \`/arch-viz\` в сессии проекта."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::arch-viz: данные старее исходников - прогони /arch-viz"
            # пинг только в начале эпизода: до этого пуша устаревания не было
            if [ -n "${BEFORE_SHA:-}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE_SHA}" 2>/dev/null && stale_at "${BEFORE_SHA}"; then
              echo "(эпизод устаревания уже шёл - TG-пинг не дублируем)" >> "$GITHUB_STEP_SUMMARY"
            else
              notify "arch-viz: в ${GITHUB_REPOSITORY} визуализация архитектуры устарела - исходники новее arch-data.json. Прогони /arch-viz в сессии проекта."
            fi
          else
            echo "Данные визуализации не старее исходников" >> "$GITHUB_STEP_SUMMARY"
          fi
